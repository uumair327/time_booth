<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Lost in Time | Umair Ansari</title>
  <meta name="theme-color" content="#08090d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
      position: relative;
      z-index: 2;
    }

    .not-found-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 100px;
      background: var(--accent-subtle);
      border: 1px solid var(--border-accent);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .not-found-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    .not-found-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.6rem, 3.5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .not-found-desc {
      font-size: 1.05rem;
      color: var(--text-secondary);
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .not-found-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 100px;
      background: var(--accent);
      color: var(--bg-primary);
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.3s var(--ease-smooth);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .not-found-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--accent-glow);
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <!-- Ambient Background -->
  <div class="ambient-bg">
    <div class="ambient-orb"></div>
    <div class="ambient-orb"></div>
    <div class="ambient-orb"></div>
  </div>
  <div class="grid-overlay"></div>

  <div class="not-found-container">
    <div class="not-found-badge">
      <span class="dot"></span>
      <span>Temporal Anomaly Detected</span>
    </div>
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">Lost in the Time Stream</h1>
    <p class="not-found-desc">
      The memory or coordinate you are trying to visit does not exist in this timeline. 
      Let's guide you back to where moments are preserved.
    </p>
    <a href="/" class="not-found-btn">
      <span>←</span> Back to Time Booth
    </a>
  </div>
</body>
</html>
